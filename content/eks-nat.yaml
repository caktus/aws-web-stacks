Resources:
  ApplicationRepository:
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryPolicyText:
        Statement:
          - Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
            Effect: Allow
            Principal:
              AWS:
                - !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':iam::'
                    - !Ref 'AWS::AccountId'
                    - :root
            Sid: AllowPushPull
        Version: '2012-10-17'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::ECR::Repository
  AssetsBucket:
    DeletionPolicy: Retain
    Properties:
      BucketEncryption: !If
        - UseAES256EncryptionCond
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref 'AWS::NoValue'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - POST
              - PUT
              - HEAD
              - GET
            AllowedOrigins: !Split
              - ;
              - !Join
                - ''
                - - https://
                  - !Join
                    - ;https://
                    - !Split
                      - ;
                      - !Join
                        - ''
                        - - !Ref 'DomainName'
                          - !If
                            - NoAlternateDomains
                            - ''
                            - ;
                          - !Join
                            - ;
                            - !Ref 'DomainNameAlternates'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
  AssetsBucketPolicy:
    Properties:
      Bucket: !Ref 'AssetsBucket'
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Principal: '*'
            Resource: !Join
              - ''
              - - !If
                  - InGovCloudRegion
                  - arn:aws-us-gov
                  - arn:aws
                - ':s3:::'
                - !Ref 'AssetsBucket'
                - /*
        Version: '2012-10-17'
    Type: AWS::S3::BucketPolicy
  AssetsCertificate:
    Condition: AssetsCreateCertificateCondition
    Properties:
      DomainName: !Ref 'AssetsCloudFrontDomain'
      DomainValidationOptions:
        - DomainName: !Ref 'AssetsCloudFrontDomain'
          ValidationDomain: !Ref 'AssetsCloudFrontDomain'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::CertificateManager::Certificate
  AssetsDistribution:
    Condition: AssetsUseCloudFrontCondition
    Properties:
      DistributionConfig:
        Aliases: !If
          - AssetsCloudFrontDomainCondition
          - - !Ref 'AssetsCloudFrontDomain'
          - !Ref 'AWS::NoValue'
        DefaultCacheBehavior:
          ForwardedValues:
            Headers:
              - Origin
              - Access-Control-Request-Headers
              - Access-Control-Request-Method
            QueryString: true
          TargetOriginId: Assets
          ViewerProtocolPolicy: allow-all
        Enabled: true
        Origins:
          - DomainName: !GetAtt 'AssetsBucket.DomainName'
            Id: Assets
            S3OriginConfig:
              OriginAccessIdentity: ''
        ViewerCertificate: !If
          - AssetsCreateCertificateCondition
          - AcmCertificateArn: !Ref 'AssetsCertificate'
            SslSupportMethod: sni-only
          - !If
            - AssetsCloudFrontCertArnCondition
            - AcmCertificateArn: !Ref 'AssetsCloudFrontCertArn'
              SslSupportMethod: sni-only
            - !Ref 'AWS::NoValue'
      Tags:
