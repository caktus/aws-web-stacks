      RouteTableId: !Ref 'NatGatewayRouteTable'
    Type: AWS::EC2::Route
  NatGatewayRouteTable:
    Properties:
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - private
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::RouteTable
  NatIp:
    Properties:
      Domain: vpc
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EC2::EIP
  Nodegroup:
    Properties:
      AmiType: !If
        - UseCustomAMIType
        - !Ref 'CustomAMIImageType'
        - !Ref 'AWS::NoValue'
      ClusterName: !Ref 'EksCluster'
      LaunchTemplate:
        Id: !Ref 'NodegroupLaunchTemplate'
        Version: !GetAtt 'NodegroupLaunchTemplate.LatestVersionNumber'
      NodeRole: !GetAtt 'ContainerInstanceRole.Arn'
      NodegroupName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - nodegroup
      ScalingConfig:
        DesiredSize: !Ref 'DesiredScale'
        MaxSize: !Ref 'MaxScale'
        MinSize: 2
      Subnets:
        - !Ref 'PrivateSubnetA'
        - !Ref 'PrivateSubnetB'
      Tags:
        Name: !Join
          - '-'
          - - !Ref 'AWS::StackName'
            - nodegroup
        aws-web-stacks:stack-name: !Ref 'AWS::StackName'
      Version: !If
        - UseEksClusterVersion
        - !Ref 'EksClusterVersion'
        - !Ref 'AWS::NoValue'
    Type: AWS::EKS::Nodegroup
  NodegroupLaunchTemplate:
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: !Ref 'UseAES256Encryption'
              KmsKeyId: !If
                - CmkArnCondition
                - !Ref 'CustomerManagedCmkArn'
                - !Ref 'AWS::NoValue'
              VolumeSize: !Ref 'ContainerVolumeSize'
              VolumeType: gp3
        ImageId: !If
          - UseCustomAMI
          - !Ref 'CustomEKSAMI'
          - !Ref 'AWS::NoValue'
        InstanceType: !Ref 'ContainerInstanceType'
        MetadataOptions:
          HttpPutResponseHopLimit: 3
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Join
                  - '-'
                  - - !Ref 'AWS::StackName'
                    - node
      LaunchTemplateName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - nodegroup-lt
    Type: AWS::EC2::LaunchTemplate
  PodIdentityAddon:
    Properties:
      AddonName: eks-pod-identity-agent
      ClusterName: !Ref 'EksCluster'
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EKS::Addon
  PrivateAssetsBucket:
    DeletionPolicy: Retain
    Properties:
      AccessControl: Private
      BucketEncryption: !If
        - UseAES256EncryptionCond
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                KMSMasterKeyID: !If
                  - CmkArnCondition
                  - !Ref 'CustomerManagedCmkArn'
                  - !Ref 'AWS::NoValue'
                SSEAlgorithm: !If
                  - CmkArnCondition
                  - aws:kms
                  - AES256
        - !Ref 'AWS::NoValue'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - POST
              - PUT
              - HEAD
              - GET
            AllowedOrigins: !Split
              - ;
              - !Join
                - ''
                - - https://
                  - !Join
                    - ;https://
                    - !Split
                      - ;
                      - !Join
                        - ''
                        - - !Ref 'DomainName'
                          - !If
                            - NoAlternateDomains
                            - ''
                            - ;
                          - !Join
                            - ;
                            - !Ref 'DomainNameAlternates'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
  PrivateSubnetA:
