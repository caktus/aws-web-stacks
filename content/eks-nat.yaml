        ImageId: !If
          - UseCustomAMI
          - !Ref 'CustomEKSAMI'
          - !Ref 'AWS::NoValue'
        InstanceType: !Ref 'ContainerInstanceType'
        MetadataOptions:
          HttpPutResponseHopLimit: 3
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Join
                  - '-'
                  - - !Ref 'AWS::StackName'
                    - node
    Type: AWS::EC2::LaunchTemplate
  PodIdentityAddon:
    Condition: UseAccessConfigCond
    Properties:
      AddonName: eks-pod-identity-agent
      ClusterName: !Ref 'EksCluster'
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EKS::Addon
  PrivateAssetsBucket:
    DeletionPolicy: Retain
    Properties:
      AccessControl: Private
      BucketEncryption: !If
        - UseAES256EncryptionCond
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                KMSMasterKeyID: !If
                  - CmkArnCondition
                  - !Ref 'CustomerManagedCmkArn'
                  - !Ref 'AWS::NoValue'
                SSEAlgorithm: !If
                  - CmkArnCondition
                  - aws:kms
                  - AES256
        - !Ref 'AWS::NoValue'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - POST
              - PUT
              - HEAD
              - GET
            AllowedOrigins: !Split
              - ;
              - !Join
                - ''
                - - https://
                  - !Join
                    - ;https://
                    - !Split
                      - ;
                      - !Join
                        - ''
                        - - !Ref 'DomainName'
                          - !If
                            - NoAlternateDomains
                            - ''
                            - ;
                          - !Join
                            - ;
                            - !Ref 'DomainNameAlternates'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
  PrivateRouteV6:
    Properties:
      DestinationIpv6CidrBlock: ::/0
      EgressOnlyInternetGatewayId: !Ref 'EgressOnlyIGW'
      RouteTableId: !Ref 'NatGatewayRouteTable'
    Type: AWS::EC2::Route
  PrivateSubnetA:
    DependsOn:
      - VpcIpv6Cidr
    Properties:
      AvailabilityZone: !Ref 'PrimaryAZ'
      CidrBlock: !Ref 'PrivateSubnetACidr'
      Ipv6CidrBlock: !Select
        - 2
        - !Cidr
          - !Select
            - 0
            - !GetAtt 'Vpc.Ipv6CidrBlocks'
          - 4
          - 64
      MapPublicIpOnLaunch: false
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - private-a
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PrivateSubnetARouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'NatGatewayRouteTable'
      SubnetId: !Ref 'PrivateSubnetA'
    Type: AWS::EC2::SubnetRouteTableAssociation
  PrivateSubnetB:
    DependsOn:
      - VpcIpv6Cidr
    Properties:
      AvailabilityZone: !Ref 'SecondaryAZ'
      CidrBlock: !Ref 'PrivateSubnetBCidr'
      Ipv6CidrBlock: !Select
        - 3
        - !Cidr
          - !Select
            - 0
            - !GetAtt 'Vpc.Ipv6CidrBlocks'
          - 4
          - 64
      MapPublicIpOnLaunch: false
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - private-b
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PrivateSubnetBRouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'NatGatewayRouteTable'
      SubnetId: !Ref 'PrivateSubnetB'
    Type: AWS::EC2::SubnetRouteTableAssociation
  PublicRoute:
    Properties:
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'
      RouteTableId: !Ref 'PublicRouteTable'
    Type: AWS::EC2::Route
  PublicRouteTable:
    Properties:
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - public
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::RouteTable
  PublicRouteV6:
    Properties:
      DestinationIpv6CidrBlock: ::/0
      GatewayId: !Ref 'InternetGateway'
      RouteTableId: !Ref 'PublicRouteTable'
    Type: AWS::EC2::Route
  PublicSubnetA:
    DependsOn:
      - VpcIpv6Cidr
    Properties:
      AvailabilityZone: !Ref 'PrimaryAZ'
      CidrBlock: !Ref 'PublicSubnetACidr'
      Ipv6CidrBlock: !Select
        - 0
        - !Cidr
          - !Select
            - 0
            - !GetAtt 'Vpc.Ipv6CidrBlocks'
          - 4
          - 64
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - public-a
        - Key: kubernetes.io/role/elb
          Value: '1'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PublicSubnetARouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      SubnetId: !Ref 'PublicSubnetA'
    Type: AWS::EC2::SubnetRouteTableAssociation
  PublicSubnetB:
    DependsOn:
      - VpcIpv6Cidr
    Properties:
      AvailabilityZone: !Ref 'SecondaryAZ'
      CidrBlock: !Ref 'PublicSubnetBCidr'
      Ipv6CidrBlock: !Select
        - 1
        - !Cidr
          - !Select
            - 0
            - !GetAtt 'Vpc.Ipv6CidrBlocks'
          - 4
          - 64
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - public-b
        - Key: kubernetes.io/role/elb
          Value: '1'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PublicSubnetBRouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      SubnetId: !Ref 'PublicSubnetB'
    Type: AWS::EC2::SubnetRouteTableAssociation
  RedisReplicationGroup:
    Condition: UsingRedis
    Properties:
      AtRestEncryptionEnabled: !Ref 'UseAES256Encryption'
      AuthToken: !If
        - AuthTokenCondition
        - !Ref 'RedisAuthToken'
        - !Ref 'AWS::NoValue'
      AutomaticFailoverEnabled: !Ref 'RedisAutomaticFailover'
      CacheNodeType: !Ref 'RedisNodeType'
      CacheSubnetGroupName: !Ref 'CacheSubnetGroup'
      Engine: redis
      EngineVersion: !Ref 'RedisVersion'
      KmsKeyId: !If
        - CmkArnCondition
        - !Ref 'CustomerManagedCmkArn'
        - !Ref 'AWS::NoValue'
      MultiAZEnabled: !Ref 'RedisAutomaticFailover'
      NumCacheClusters: !Ref 'RedisNumCacheClusters'
      Port: 6379
      PreferredCacheClusterAZs: !If
        - RedisAutomaticFailoverCondition
        - - !Ref 'PrimaryAZ'
          - !Ref 'SecondaryAZ'
        - !Ref 'AWS::NoValue'
      ReplicationGroupDescription: Redis ReplicationGroup
      SecurityGroupIds:
        - !Ref 'CacheSecurityGroup'
      SnapshotRetentionLimit: !Ref 'RedisSnapshotRetentionLimit'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - redis
      TransitEncryptionEnabled: !Ref 'UseAES256Encryption'
    Type: AWS::ElastiCache::ReplicationGroup
  SSMNodegroupUpdateServiceRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
      ManagedPolicyArns:
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/service-role/AmazonSSMAutomationRole
      Path: /
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - eks:DescribeCluster
                  - eks:DescribeNodegroup
                  - eks:UpdateNodegroupVersion
                  - eks:UpdateNodegroupConfig
                  - eks:DescribeUpdate
                  - eks:DescribeAddon
                  - eks:DescribeAddonVersions
                  - eks:ListAddons
                  - eks:UpdateAddon
                Effect: Allow
                Resource: '*'
              - Action:
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:RunInstances
                Effect: Allow
                Resource: '*'
              - Action:
                  - iam:PassRole
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':iam::'
                    - !Ref 'AWS::AccountId'
                    - :role/AmazonEKS*
              - Action:
                  - ssm:StartAutomationExecution
                  - ssm:GetAutomationExecution
                  - ssm:DescribeAutomationExecutions
                  - ssm:DescribeAutomationStepExecutions
                Effect: Allow
                Resource: '*'
          PolicyName: EKSNodegroupUpdatePolicy
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::IAM::Role
  VPCS3Endpoint:
    Properties:
      RouteTableIds:
        - !Ref 'NatGatewayRouteTable'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::VPCEndpoint
  Vpc:
    Properties:
      CidrBlock: !Ref 'VpcCidr'
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - vpc
    Type: AWS::EC2::VPC
  VpcIpv6Cidr:
    Properties:
      AmazonProvidedIpv6CidrBlock: true
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::VPCCidrBlock
