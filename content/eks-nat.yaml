        - !If
          - UsingMemcached
          - CidrIp: !Ref 'PrivateSubnetBCidr'
            FromPort: 11211
            IpProtocol: tcp
            ToPort: 11211
          - !Ref 'AWS::NoValue'
        - !If
          - UsingRedis
          - CidrIp: !Ref 'PrivateSubnetACidr'
            FromPort: 6379
            IpProtocol: tcp
            ToPort: 6379
          - !Ref 'AWS::NoValue'
        - !If
          - UsingRedis
          - CidrIp: !Ref 'PrivateSubnetBCidr'
            FromPort: 6379
            IpProtocol: tcp
            ToPort: 6379
          - !Ref 'AWS::NoValue'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - cache
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  CacheSubnetGroup:
    Condition: EitherCacheCondition
    Properties:
      Description: Cache subnet group
      SubnetIds:
        - !Ref 'PrivateSubnetA'
        - !Ref 'PrivateSubnetB'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::ElastiCache::SubnetGroup
  ContainerInstanceProfile:
    Properties:
      Path: /
      Roles:
        - !Ref 'ContainerInstanceRole'
    Type: AWS::IAM::InstanceProfile
  ContainerInstanceRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
      ManagedPolicyArns:
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/AmazonEKSWorkerNodePolicy
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/AmazonEKS_CNI_Policy
      Path: /
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - s3:ListBucket
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':s3:::'
                    - !Ref 'AssetsBucket'
              - Action:
                  - s3:*
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':s3:::'
                    - !Ref 'AssetsBucket'
                    - /*
              - Action:
                  - s3:ListBucket
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':s3:::'
                    - !Ref 'PrivateAssetsBucket'
              - Action:
                  - s3:*
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':s3:::'
                    - !Ref 'PrivateAssetsBucket'
                    - /*
          PolicyName: AssetsManagementPolicy
        - PolicyDocument:
            Statement:
              - Action:
                  - logs:Create*
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - :logs:*:*:*
          PolicyName: LoggingPolicy
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::IAM::Role
  ContainerLogs:
    DeletionPolicy: Retain
    Properties:
      RetentionInDays: 365
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Retain
  DatabaseInstance:
    Condition: DatabaseCondition
    DeletionPolicy: Snapshot
    Properties:
      AllocatedStorage: !Ref 'DatabaseAllocatedStorage'
      BackupRetentionPeriod: !Ref 'DatabaseBackupRetentionDays'
      DBInstanceClass: !Ref 'DatabaseClass'
      DBName: !Ref 'DatabaseName'
      DBParameterGroupName: !Ref 'DatabaseParameterGroup'
      DBSubnetGroupName: !Ref 'DatabaseSubnetGroup'
      EnableCloudwatchLogsExports: !If
        - DatabaseLoggingCondition
        - !Ref 'DatabaseCloudWatchLogTypes'
        - !Ref 'AWS::NoValue'
      Engine: !Ref 'DatabaseEngine'
      EngineVersion: !Ref 'DatabaseEngineVersion'
      KmsKeyId: !If
        - CmkArnCondition
        - !Ref 'CustomerManagedCmkArn'
        - !Ref 'AWS::NoValue'
      MasterUserPassword: !Ref 'DatabasePassword'
      MasterUsername: !Ref 'DatabaseUser'
      MultiAZ: !Ref 'DatabaseMultiAZ'
      StorageEncrypted: !Ref 'UseAES256Encryption'
      StorageType: gp2
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VPCSecurityGroups:
        - !Ref 'DatabaseSecurityGroup'
    Type: AWS::RDS::DBInstance
    UpdateReplacePolicy: Snapshot
  DatabaseParameterGroup:
    Condition: DatabaseCondition
    Properties:
      Description: DB parameter group.
      Family: !Ref 'DatabaseParameterGroupFamily'
      Parameters: {}
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::RDS::DBParameterGroup
  DatabaseReplica:
    Condition: DatabaseReplicationCondition
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceClass: !Ref 'DatabaseClass'
      Engine: !Ref 'DatabaseEngine'
      SourceDBInstanceIdentifier: !Ref 'DatabaseInstance'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VPCSecurityGroups:
        - !Ref 'DatabaseSecurityGroup'
    Type: AWS::RDS::DBInstance
    UpdateReplacePolicy: Snapshot
  DatabaseSecurityGroup:
    Condition: DatabaseCondition
    Properties:
      GroupDescription: DB security group.
      SecurityGroupIngress:
        - CidrIp: !Ref 'PrivateSubnetACidr'
          FromPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
          IpProtocol: tcp
          ToPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
        - CidrIp: !Ref 'PrivateSubnetBCidr'
          FromPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
          IpProtocol: tcp
          ToPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - rds
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  DatabaseSubnetGroup:
    Condition: DatabaseCondition
    Properties:
      DBSubnetGroupDescription: DB subnet group
      SubnetIds:
        - !Ref 'PrivateSubnetA'
        - !Ref 'PrivateSubnetB'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::RDS::DBSubnetGroup
  EBSCSIAddon:
    Properties:
      AddonName: aws-ebs-csi-driver
      ClusterName: !Ref 'EksCluster'
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EKS::Addon
  EBSCSIDriverRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              StringEquals:
                aws:SourceArn: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - ':eks:'
                    - !Ref 'AWS::Region'
                    - ':'
                    - !Ref 'AWS::AccountId'
                    - :cluster/
                    - !Ref 'EksClusterName'
            Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
      Path: /
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::IAM::Role
  EBSCSIPodIdentity:
    DependsOn:
      - PodIdentityAddon
      - EBSCSIAddon
    Properties:
      ClusterName: !Ref 'EksCluster'
      Namespace: kube-system
      RoleArn: !GetAtt 'EBSCSIDriverRole.Arn'
      ServiceAccount: ebs-csi-controller-sa
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EKS::PodIdentityAssociation
  EksCluster:
    Properties:
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true
      EncryptionConfig: !If
        - EnableEksEncryptionConfigCond
        - - Provider:
              KeyArn: !Ref 'CustomerManagedCmkArn'
            Resources:
              - secrets
        - !Ref 'AWS::NoValue'
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
      Name: !Ref 'EksClusterName'
      ResourcesVpcConfig:
        EndpointPrivateAccess: !If
          - RestrictEksApiAccessCond
          - true
          - false
        EndpointPublicAccess: true
        PublicAccessCidrs: !If
          - RestrictEksApiAccessCond
          - !Ref 'EksPublicAccessCidrs'
          - !Ref 'AWS::NoValue'
        SecurityGroupIds:
          - !Ref 'EksClusterSecurityGroup'
        SubnetIds:
          - !Ref 'PublicSubnetA'
          - !Ref 'PublicSubnetB'
          - !Ref 'PrivateSubnetA'
          - !Ref 'PrivateSubnetB'
      RoleArn: !GetAtt 'EksServiceRole.Arn'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      Version: !If
        - UseEksClusterVersion
        - !Ref 'EksClusterVersion'
        - !Ref 'AWS::NoValue'
    Type: AWS::EKS::Cluster
  EksClusterSecurityGroup:
    Properties:
      GroupDescription: EKS security group.
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - eks-cluster
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  EksServiceRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
      ManagedPolicyArns:
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/AmazonEKSClusterPolicy
        - !Join
          - ''
          - - !If
              - InGovCloudRegion
              - arn:aws-us-gov
              - arn:aws
            - :iam::aws:policy/AmazonEKSServicePolicy
      Path: /
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::IAM::Role
  GatewayAttachement:
    Properties:
      InternetGatewayId: !Ref 'InternetGateway'
