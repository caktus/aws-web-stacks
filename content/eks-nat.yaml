            - '-'
            - - !Ref 'AWS::StackName'
              - igw
    Type: AWS::EC2::InternetGateway
  NatGateway:
    Properties:
      AllocationId: !GetAtt 'NatIp.AllocationId'
      SubnetId: !Ref 'PublicSubnetA'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - nat
    Type: AWS::EC2::NatGateway
  NatGatewayRoute:
    Properties:
      DestinationCidrBlock: '0.0.0.0/0'
