      - mariadb10.0
      - mariadb10.1
      - mariadb10.2
      - mariadb10.3
      - mysql5.5
      - mysql5.6
      - mysql5.7
      - mysql8.0
      - oracle-ee-11.2
      - oracle-ee-12.1
      - oracle-ee-12.2
      - oracle-se-11.2
      - oracle-se1-11.2
      - oracle-se2-12.1
      - oracle-se2-12.2
      - aurora5.6
      - postgres10
      - postgres11
      - postgres12
      - postgres13
      - postgres14
      - postgres15
      - postgres16
      - postgres17
      - sqlserver-ee-11.0
      - sqlserver-ee-12.0
      - sqlserver-ee-13.0
      - sqlserver-ee-14.0
      - sqlserver-ex-11.0
      - sqlserver-ex-12.0
      - sqlserver-ex-13.0
      - sqlserver-ex-14.0
      - sqlserver-se-11.0
      - sqlserver-se-12.0
      - sqlserver-se-13.0
      - sqlserver-se-14.0
      - sqlserver-web-11.0
      - sqlserver-web-12.0
      - sqlserver-web-13.0
      - sqlserver-web-14.0
    Description: Database parameter group family name; must match the engine and version of the RDS instance.
    Type: String
  DatabasePassword:
    AllowedPattern: '[ !#-.0-?A-~]*'
    ConstraintDescription: must consist of 10-41 printable ASCII characters except "/", """, or "@".
    Description: The database admin account password must consist of 10-41 printableASCII characters *except* "/", """, or "@".
    MaxLength: '41'
    MinLength: '10'
    NoEcho: true
    Type: String
  DatabaseReplication:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Whether to create a database server replica - WARNING this will fail if DatabaseBackupRetentionDays is 0.
    Type: String
  DatabaseUser:
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
    ConstraintDescription: must begin with a letter and contain only alphanumeric characters and underscores.
    Default: app
    Description: The database admin account username
    MaxLength: '63'
    MinLength: '1'
    Type: String
  DesiredScale:
    Default: '2'
    Description: Desired container instances count
    Type: Number
  DomainName:
    Description: The fully-qualified domain name for the application.
    Type: String
  DomainNameAlternates:
    Description: A comma-separated list of Alternate FQDNs to be included in the Subject Alternative Name extension of the SSL certificate.
    Type: CommaDelimitedList
  KeyName:
    ConstraintDescription: must be the name of an existing EC2 KeyPair.
    Description: Name of an existing EC2 KeyPair to enable SSH access to the AWS EC2 instances
    Type: AWS::EC2::KeyPair::KeyName
  MaxScale:
    Default: '4'
    Description: Maximum container instances count
    Type: Number
  PrimaryAZ:
    Description: The primary availability zone for creating resources.
    Type: AWS::EC2::AvailabilityZone::Name
  PrivateSubnetACidr:
    AllowedPattern: >-
      ^((10\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)|(172\.(1[6-9]|2[0-9]|3[0-1])\.)|192\.168\.)(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: Must be a private IPv4 range with size /16 and /28.
    Default: 10.0.8.0/22
    Description: IPv4 CIDR block for the private subnet in the primary AZ. [Possibly not modifiable after stack creation]
    Type: String
  PrivateSubnetBCidr:
    AllowedPattern: >-
      ^((10\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)|(172\.(1[6-9]|2[0-9]|3[0-1])\.)|192\.168\.)(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: Must be a private IPv4 range with size /16 and /28.
    Default: 10.0.12.0/22
    Description: IPv4 CIDR block for the private subnet in the secondary AZ. [Possibly not modifiable after stack creation]
    Type: String
  PublicSubnetACidr:
    AllowedPattern: >-
      ^((10\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)|(172\.(1[6-9]|2[0-9]|3[0-1])\.)|192\.168\.)(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: Must be a private IPv4 range with size /16 and /28.
    Default: 10.0.0.0/22
    Description: IPv4 CIDR block for the public subnet in the primary AZ. [Possibly not modifiable after stack creation]
    Type: String
  PublicSubnetBCidr:
    AllowedPattern: >-
      ^((10\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)|(172\.(1[6-9]|2[0-9]|3[0-1])\.)|192\.168\.)(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: Must be a private IPv4 range with size /16 and /28.
    Default: 10.0.4.0/22
    Description: IPv4 CIDR block for the public subnet in the secondary AZ. [Possibly not modifiable after stack creation]
    Type: String
  RedisAuthToken:
    AllowedPattern: '[ !#-.0-?A-~]*'
    ConstraintDescription: must consist of 16-128 printable ASCII characters except "/", """, or "@".
    Default: DO_NOT_CREATE_AUTH_TOKEN
    Description: The password used to access a Redis ReplicationGroup (required for HIPAA).
    MaxLength: '128'
    MinLength: '16'
    NoEcho: true
    Type: String
  RedisAutomaticFailover:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Specifies whether a read-only replica is automatically promoted to read/write primary if the existing primary fails.
    Type: String
  RedisNodeType:
    AllowedValues:
      - (none)
      - cache.t2.micro
      - cache.t2.small
      - cache.t2.medium
      - cache.t3.micro
      - cache.t3.small
      - cache.t3.medium
      - cache.m3.medium
      - cache.m3.large
      - cache.m3.xlarge
      - cache.m3.2xlarge
      - cache.m4.large
      - cache.m4.xlarge
      - cache.m4.2xlarge
      - cache.m4.4xlarge
      - cache.m4.10xlarge
      - cache.r4.large
      - cache.r4.xlarge
      - cache.r4.2xlarge
      - cache.r4.4xlarge
      - cache.r4.8xlarge
      - cache.r4.16xlarge
      - cache.r3.large
      - cache.r3.xlarge
      - cache.r3.2xlarge
      - cache.r3.4xlarge
      - cache.r3.8xlarge
    ConstraintDescription: must select a valid cache node type.
    Default: (none)
    Description: Redis instance type
    Type: String
  RedisNumCacheClusters:
    Default: '1'
    Description: The number of clusters this replication group initially has.
    Type: Number
  RedisSnapshotRetentionLimit:
    Default: '0'
    Description: >-
      The number of days for which ElastiCache retains automatic snapshots before deleting them.For example, if you set SnapshotRetentionLimit to 5, a snapshot that was taken today is retained for 5 days
      before being deleted. 0 = automatic backups are disabled for this cluster.
    Type: Number
  RedisVersion:
    Default: ''
    Description: 'Redis version to use. See available versions: aws elasticache describe-cache-engine-versions'
    Type: String
  SecondaryAZ:
    Description: The secondary availability zone for creating resources. Must differ from primary zone.
    Type: AWS::EC2::AvailabilityZone::Name
  SecretKey:
    Description: Application secret key for this stack (optional)
    NoEcho: true
    Type: String
  UseAES256Encryption:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Whether or not to use server side encryption for S3, EBS, and RDS. When true, encryption is enabled for all resources.
    Type: String
  UseSFTPServer:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Whether or not to set up an SFTP service.  If 'true', this will set up a transfer server and add an S3 bucket for its use, along with a role and policies for use when adding users.
    Type: String
  VpcCidr:
    AllowedPattern: >-
      ^((10\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)|(172\.(1[6-9]|2[0-9]|3[0-1])\.)|192\.168\.)(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: Must be a private IPv4 range with size /16 and /28.
    Default: 10.0.0.0/20
    Description: The primary IPv4 CIDR block for the VPC. [Possibly not modifiable after stack creation]
    Type: String
  WebWorkerHealthCheck:
    Default: ''
    Description: Web worker health check URL path, e.g., "/health-check"; required unless WebWorkerHealthCheckProtocol is TCP
    Type: String
  WebWorkerHealthCheckPort:
    Default: '80'
    Description: Web worker health check port
    Type: Number
  WebWorkerHealthCheckProtocol:
    AllowedValues:
      - TCP
      - HTTP
      - HTTPS
    Default: TCP
    Description: Web worker health check protocol
    Type: String
  WebWorkerPort:
    Default: '80'
    Description: Default web worker exposed port (non-HTTPS)
    Type: Number
  WebWorkerProtocol:
    AllowedValues:
      - HTTP
      - HTTPS
    Default: HTTP
    Description: Web worker instance protocol
    Type: String
Resources:
  AssetsBucket:
    DeletionPolicy: Retain
    Properties:
      AccessControl: !Ref 'AssetsBucketAccessControl'
      BucketEncryption: !If
        - UseAES256EncryptionCond
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref 'AWS::NoValue'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - POST
              - PUT
              - HEAD
              - GET
            AllowedOrigins: !Split
              - ;
              - !Join
                - ''
                - - https://
                  - !Join
                    - ;https://
                    - !Split
                      - ;
                      - !Join
                        - ''
                        - - !Ref 'DomainName'
                          - !If
                            - NoAlternateDomains
                            - ''
                            - ;
                          - !Join
                            - ;
                            - !Ref 'DomainNameAlternates'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
  AutoScalingGroup:
    Properties:
      DesiredCapacity: !Ref 'DesiredScale'
      HealthCheckGracePeriod: 300
      HealthCheckType: EC2
      LaunchConfigurationName: !Ref 'LaunchConfiguration'
      LoadBalancerNames:
        - !Ref 'LoadBalancer'
      MaxSize: !Ref 'MaxScale'
      MinSize: !Ref 'DesiredScale'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          PropagateAtLaunch: true
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - web_worker
        - Key: aws-web-stacks:role
          PropagateAtLaunch: true
          Value: worker
      VPCZoneIdentifier:
        - !Ref 'PrivateSubnetA'
        - !Ref 'PrivateSubnetB'
    Type: AWS::AutoScaling::AutoScalingGroup
  BastionEIP:
    Condition: BastionTypeSet
    Properties:
      Domain: vpc
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EC2::EIP
  BastionEIPAssociation:
    Condition: BastionTypeAndAMISet
    Properties:
      AllocationId: !GetAtt 'BastionEIP.AllocationId'
      InstanceId: !Ref 'BastionInstance'
    Type: AWS::EC2::EIPAssociation
  BastionInstance:
    Condition: BastionTypeAndAMISet
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            Encrypted: !Ref 'UseAES256Encryption'
            KmsKeyId: !If
              - CmkArnCondition
              - !Ref 'CustomerManagedCmkArn'
              - !Ref 'AWS::NoValue'
            VolumeSize: 8
            VolumeType: gp2
      ImageId: !Ref 'BastionAMI'
      InstanceType: !Ref 'BastionInstanceType'
      KeyName: !Ref 'BastionKeyName'
      SecurityGroupIds:
        - !Ref 'BastionSecurityGroup'
      SubnetId: !Ref 'PublicSubnetA'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - bastion
        - Key: aws-web-stacks:role
          Value: bastion
    Type: AWS::EC2::Instance
  BastionSecurityGroup:
    Condition: BastionTypeSet
    Properties:
      GroupDescription: Bastion security group.
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - bastion
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  BastionSecurityGroupIngressHTTPS:
    Condition: BastionTypeIsOpenVPNSet
    Properties:
      CidrIp: !Ref 'AdministratorIPAddress'
      Description: Administrator HTTPS access.
      FromPort: 443
      GroupId: !Ref 'BastionSecurityGroup'
      IpProtocol: tcp
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  BastionSecurityGroupIngressOpenVPN:
    Condition: BastionTypeIsOpenVPNSet
    Properties:
      CidrIp: '0.0.0.0/0'
      Description: OpenVPN Access.
      FromPort: 1194
      GroupId: !Ref 'BastionSecurityGroup'
      IpProtocol: udp
      ToPort: 1194
    Type: AWS::EC2::SecurityGroupIngress
  BastionSecurityGroupIngressSSH:
    Condition: BastionTypeSet
    Properties:
      CidrIp: !Ref 'AdministratorIPAddress'
      Description: Administrator SSH access.
      FromPort: 22
      GroupId: !Ref 'BastionSecurityGroup'
      IpProtocol: tcp
      ToPort: 22
    Type: AWS::EC2::SecurityGroupIngress
  CacheCluster:
    Condition: UsingMemcached
    Properties:
      CacheNodeType: !Ref 'CacheNodeType'
      CacheSubnetGroupName: !Ref 'CacheSubnetGroup'
      Engine: memcached
      NumCacheNodes: 1
      Port: 11211
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - cache
      VpcSecurityGroupIds:
        - !Ref 'CacheSecurityGroup'
    Type: AWS::ElastiCache::CacheCluster
  CacheSecurityGroup:
    Condition: EitherCacheCondition
    Properties:
      GroupDescription: Cache security group.
      SecurityGroupIngress:
        - !If
          - UsingMemcached
          - CidrIp: !Ref 'PrivateSubnetACidr'
            FromPort: 11211
            IpProtocol: tcp
            ToPort: 11211
          - !Ref 'AWS::NoValue'
        - !If
          - UsingMemcached
          - CidrIp: !Ref 'PrivateSubnetBCidr'
            FromPort: 11211
            IpProtocol: tcp
            ToPort: 11211
          - !Ref 'AWS::NoValue'
        - !If
          - UsingRedis
          - CidrIp: !Ref 'PrivateSubnetACidr'
            FromPort: 6379
            IpProtocol: tcp
            ToPort: 6379
          - !Ref 'AWS::NoValue'
        - !If
          - UsingRedis
          - CidrIp: !Ref 'PrivateSubnetBCidr'
            FromPort: 6379
            IpProtocol: tcp
            ToPort: 6379
          - !Ref 'AWS::NoValue'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - cache
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  CacheSubnetGroup:
    Condition: EitherCacheCondition
    Properties:
      Description: Subnets available for the cache instance
      SubnetIds:
        - !Ref 'PrivateSubnetA'
        - !Ref 'PrivateSubnetB'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::ElastiCache::SubnetGroup
  ContainerInstanceProfile:
    Properties:
      Path: /
      Roles:
        - !Ref 'ContainerInstanceRole'
    Type: AWS::IAM::InstanceProfile
  ContainerInstanceRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
      Path: /
      Policies:
        - PolicyDocument:
            Statement: !If
              - UseSFTPServerCondition
              - - Action:
                    - s3:ListBucket
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'AssetsBucket'
                - Action:
                    - s3:*
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'AssetsBucket'
                      - /*
                - Action:
                    - s3:ListBucket
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'PrivateAssetsBucket'
                - Action:
                    - s3:*
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'PrivateAssetsBucket'
                      - /*
                - Action:
                    - s3:ListBucket
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'SFTPAssetsBucket'
                - Action:
                    - s3:*
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'SFTPAssetsBucket'
                      - /*
              - - Action:
                    - s3:ListBucket
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'AssetsBucket'
                - Action:
                    - s3:*
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'AssetsBucket'
                      - /*
                - Action:
                    - s3:ListBucket
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'PrivateAssetsBucket'
                - Action:
                    - s3:*
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'PrivateAssetsBucket'
                      - /*
          PolicyName: AssetsManagementPolicy
        - PolicyDocument:
            Statement:
              - Action:
                  - logs:Create*
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Effect: Allow
                Resource: !Join
                  - ''
                  - - !If
                      - InGovCloudRegion
                      - arn:aws-us-gov
                      - arn:aws
                    - :logs:*:*:*
          PolicyName: LoggingPolicy
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::IAM::Role
  ContainerLogs:
    DeletionPolicy: Retain
    Properties:
      RetentionInDays: 365
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::Logs::LogGroup
  ContainerSecurityGroup:
    Properties:
      GroupDescription: Container security group.
      SecurityGroupIngress:
        - FromPort: !Ref 'WebWorkerPort'
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref 'LoadBalancerSecurityGroup'
          ToPort: !Ref 'WebWorkerPort'
        - FromPort: '443'
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref 'LoadBalancerSecurityGroup'
          ToPort: '443'
        - Description: ELB Health Check
          FromPort: !Ref 'WebWorkerHealthCheckPort'
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref 'LoadBalancerSecurityGroup'
          ToPort: !Ref 'WebWorkerHealthCheckPort'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - container
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  ContainerSecurityGroupOpenVPNIngress:
    Condition: BastionTypeIsOpenVPNSet
    Properties:
      GroupId: !Ref 'ContainerSecurityGroup'
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref 'BastionSecurityGroup'
    Type: AWS::EC2::SecurityGroupIngress
  ContainerSecurityGroupSSHBastionIngress:
    Condition: BastionTypeIsSSHSet
    Properties:
      FromPort: 22
      GroupId: !Ref 'ContainerSecurityGroup'
      IpProtocol: tcp
      SourceSecurityGroupId: !Ref 'BastionSecurityGroup'
      ToPort: 22
    Type: AWS::EC2::SecurityGroupIngress
  DatabaseInstance:
    Condition: DatabaseCondition
    DeletionPolicy: Snapshot
    Properties:
      AllocatedStorage: !Ref 'DatabaseAllocatedStorage'
      BackupRetentionPeriod: !Ref 'DatabaseBackupRetentionDays'
      DBInstanceClass: !Ref 'DatabaseClass'
      DBName: !Ref 'DatabaseName'
      DBParameterGroupName: !Ref 'DatabaseParameterGroup'
      DBSubnetGroupName: !Ref 'DatabaseSubnetGroup'
      EnableCloudwatchLogsExports: !If
        - DatabaseLoggingCondition
        - !Ref 'DatabaseCloudWatchLogTypes'
        - !Ref 'AWS::NoValue'
      Engine: !Ref 'DatabaseEngine'
      EngineVersion: !Ref 'DatabaseEngineVersion'
      KmsKeyId: !If
        - CmkArnCondition
        - !Ref 'CustomerManagedCmkArn'
        - !Ref 'AWS::NoValue'
      MasterUserPassword: !Ref 'DatabasePassword'
      MasterUsername: !Ref 'DatabaseUser'
      MultiAZ: !Ref 'DatabaseMultiAZ'
      StorageEncrypted: !Ref 'UseAES256Encryption'
      StorageType: gp2
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VPCSecurityGroups:
        - !Ref 'DatabaseSecurityGroup'
    Type: AWS::RDS::DBInstance
  DatabaseParameterGroup:
    Condition: DatabaseCondition
    Properties:
      Description: Database parameter group.
      Family: !Ref 'DatabaseParameterGroupFamily'
      Parameters: {}
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::RDS::DBParameterGroup
  DatabaseReplica:
    Condition: DatabaseReplicationCondition
    Properties:
      DBInstanceClass: !Ref 'DatabaseClass'
      Engine: !Ref 'DatabaseEngine'
      SourceDBInstanceIdentifier: !Ref 'DatabaseInstance'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VPCSecurityGroups:
        - !Ref 'DatabaseSecurityGroup'
    Type: AWS::RDS::DBInstance
  DatabaseSecurityGroup:
    Condition: DatabaseCondition
    Properties:
      GroupDescription: Database security group.
      SecurityGroupIngress:
        - CidrIp: !Ref 'PrivateSubnetACidr'
          FromPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
          IpProtocol: tcp
          ToPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
        - CidrIp: !Ref 'PrivateSubnetBCidr'
          FromPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
          IpProtocol: tcp
          ToPort: !FindInMap
            - RdsEngineMap
            - !Ref 'DatabaseEngine'
            - Port
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - rds
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  DatabaseSecurityGroupBastionIngress:
    Condition: BastionDatabaseCondition
    Properties:
      Description: Bastion Access
      FromPort: !FindInMap
        - RdsEngineMap
        - !Ref 'DatabaseEngine'
        - Port
      GroupId: !Ref 'DatabaseSecurityGroup'
      IpProtocol: tcp
      SourceSecurityGroupId: !Ref 'BastionSecurityGroup'
      ToPort: !FindInMap
        - RdsEngineMap
        - !Ref 'DatabaseEngine'
        - Port
    Type: AWS::EC2::SecurityGroupIngress
  DatabaseSubnetGroup:
    Condition: DatabaseCondition
    Properties:
      DBSubnetGroupDescription: Subnets available for the RDS DB Instance
      SubnetIds:
        - !Ref 'PrivateSubnetA'
        - !Ref 'PrivateSubnetB'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::RDS::DBSubnetGroup
  GatewayAttachement:
    Properties:
      InternetGatewayId: !Ref 'InternetGateway'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::VPCGatewayAttachment
  InternetGateway:
    Properties:
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - igw
    Type: AWS::EC2::InternetGateway
  LaunchConfiguration:
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            Encrypted: !Ref 'UseAES256Encryption'
            VolumeSize: !Ref 'ContainerVolumeSize'
            VolumeType: gp2
      IamInstanceProfile: !Ref 'ContainerInstanceProfile'
      ImageId: !Ref 'AMI'
      InstanceType: !Ref 'ContainerInstanceType'
      KeyName: !Ref 'KeyName'
      SecurityGroups:
        - !Ref 'ContainerSecurityGroup'
    Type: AWS::AutoScaling::LaunchConfiguration
  LoadBalancer:
    Properties:
      CrossZone: true
      HealthCheck:
        HealthyThreshold: '2'
        Interval: '100'
        Target: !Join
          - ''
          - - !Ref 'WebWorkerHealthCheckProtocol'
            - ':'
            - !Ref 'WebWorkerHealthCheckPort'
            - !Ref 'WebWorkerHealthCheck'
        Timeout: '10'
        UnhealthyThreshold: '2'
      Listeners:
        - InstancePort: !Ref 'WebWorkerPort'
          InstanceProtocol: !Ref 'WebWorkerProtocol'
          LoadBalancerPort: 80
          Protocol: HTTP
        - InstancePort: 443
          InstanceProtocol: TCP
          LoadBalancerPort: 443
          Protocol: TCP
      SecurityGroups:
        - !Ref 'LoadBalancerSecurityGroup'
      Subnets:
        - !Ref 'PublicSubnetA'
        - !Ref 'PublicSubnetB'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::ElasticLoadBalancing::LoadBalancer
  LoadBalancerSecurityGroup:
    Properties:
      GroupDescription: Web load balancer security group.
      SecurityGroupIngress:
        - CidrIp: '0.0.0.0/0'
          FromPort: '80'
          IpProtocol: tcp
          ToPort: '80'
        - CidrIp: '0.0.0.0/0'
          FromPort: '443'
          IpProtocol: tcp
          ToPort: '443'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - elb
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::SecurityGroup
  NatGateway:
    Properties:
      AllocationId: !GetAtt 'NatIp.AllocationId'
      SubnetId: !Ref 'PublicSubnetA'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - nat
    Type: AWS::EC2::NatGateway
  NatGatewayRoute:
    Properties:
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref 'NatGateway'
      RouteTableId: !Ref 'NatGatewayRouteTable'
    Type: AWS::EC2::Route
  NatGatewayRouteTable:
    Properties:
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - private
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::RouteTable
  NatIp:
    Properties:
      Domain: vpc
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::EC2::EIP
  PrivateAssetsBucket:
    DeletionPolicy: Retain
    Properties:
      AccessControl: Private
      BucketEncryption: !If
        - UseAES256EncryptionCond
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                KMSMasterKeyID: !If
                  - CmkArnCondition
                  - !Ref 'CustomerManagedCmkArn'
                  - !Ref 'AWS::NoValue'
                SSEAlgorithm: !If
                  - CmkArnCondition
                  - aws:kms
                  - AES256
        - !Ref 'AWS::NoValue'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - POST
              - PUT
              - HEAD
              - GET
            AllowedOrigins: !Split
              - ;
              - !Join
                - ''
                - - https://
                  - !Join
                    - ;https://
                    - !Split
                      - ;
                      - !Join
                        - ''
                        - - !Ref 'DomainName'
                          - !If
                            - NoAlternateDomains
                            - ''
                            - ;
                          - !Join
                            - ;
                            - !Ref 'DomainNameAlternates'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
  PrivateSubnetA:
    Properties:
      AvailabilityZone: !Ref 'PrimaryAZ'
      CidrBlock: !Ref 'PrivateSubnetACidr'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - private-a
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PrivateSubnetARouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'NatGatewayRouteTable'
      SubnetId: !Ref 'PrivateSubnetA'
    Type: AWS::EC2::SubnetRouteTableAssociation
  PrivateSubnetB:
    Properties:
      AvailabilityZone: !Ref 'SecondaryAZ'
      CidrBlock: !Ref 'PrivateSubnetBCidr'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - private-b
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PrivateSubnetBRouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'NatGatewayRouteTable'
      SubnetId: !Ref 'PrivateSubnetB'
    Type: AWS::EC2::SubnetRouteTableAssociation
  PublicRoute:
    Properties:
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'
      RouteTableId: !Ref 'PublicRouteTable'
    Type: AWS::EC2::Route
  PublicRouteTable:
    Properties:
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - public
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::RouteTable
  PublicSubnetA:
    Properties:
      AvailabilityZone: !Ref 'PrimaryAZ'
      CidrBlock: !Ref 'PublicSubnetACidr'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - public-a
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PublicSubnetARouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      SubnetId: !Ref 'PublicSubnetA'
    Type: AWS::EC2::SubnetRouteTableAssociation
  PublicSubnetB:
    Properties:
      AvailabilityZone: !Ref 'SecondaryAZ'
      CidrBlock: !Ref 'PublicSubnetBCidr'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - public-b
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::Subnet
  PublicSubnetBRouteTableAssociation:
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      SubnetId: !Ref 'PublicSubnetB'
    Type: AWS::EC2::SubnetRouteTableAssociation
  RedisReplicationGroup:
    Condition: UsingRedis
    Properties:
      AtRestEncryptionEnabled: !Ref 'UseAES256Encryption'
      AuthToken: !If
        - AuthTokenCondition
        - !Ref 'RedisAuthToken'
        - !Ref 'AWS::NoValue'
      AutomaticFailoverEnabled: !Ref 'RedisAutomaticFailover'
      CacheNodeType: !Ref 'RedisNodeType'
      CacheSubnetGroupName: !Ref 'CacheSubnetGroup'
      Engine: redis
      EngineVersion: !Ref 'RedisVersion'
      KmsKeyId: !If
        - CmkArnCondition
        - !Ref 'CustomerManagedCmkArn'
        - !Ref 'AWS::NoValue'
      MultiAZEnabled: !Ref 'RedisAutomaticFailover'
      NumCacheClusters: !Ref 'RedisNumCacheClusters'
      Port: 6379
      PreferredCacheClusterAZs: !If
        - RedisAutomaticFailoverCondition
        - - !Ref 'PrimaryAZ'
          - !Ref 'SecondaryAZ'
        - !Ref 'AWS::NoValue'
      ReplicationGroupDescription: Redis ReplicationGroup
      SecurityGroupIds:
        - !Ref 'CacheSecurityGroup'
      SnapshotRetentionLimit: !Ref 'RedisSnapshotRetentionLimit'
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - redis
      TransitEncryptionEnabled: !Ref 'UseAES256Encryption'
    Type: AWS::ElastiCache::ReplicationGroup
  SFTPAssetsBucket:
    DeletionPolicy: Retain
    Properties:
      AccessControl: Private
      BucketEncryption: !If
        - UseAES256EncryptionCond
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                KMSMasterKeyID: !If
                  - CmkArnCondition
                  - !Ref 'CustomerManagedCmkArn'
                  - !Ref 'AWS::NoValue'
                SSEAlgorithm: !If
                  - CmkArnCondition
                  - aws:kms
                  - AES256
        - !Ref 'AWS::NoValue'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - POST
              - PUT
              - HEAD
              - GET
            AllowedOrigins: !Split
              - ;
              - !Join
                - ''
                - - https://
                  - !Join
                    - ;https://
                    - !Split
                      - ;
                      - !Join
                        - ''
                        - - !Ref 'DomainName'
                          - !If
                            - NoAlternateDomains
                            - ''
                            - ;
                          - !Join
                            - ;
                            - !Ref 'DomainNameAlternates'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
  SFTPUserRole:
    Condition: UseSFTPServerCondition
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - transfer.amazonaws.com
      Policies:
        - PolicyDocument:
            Statement: !If
              - UseSFTPWithKMSCondition
              - - Action:
                    - s3:ListBucket
                    - s3:GetBucketLocation
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'SFTPAssetsBucket'
                - Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:DeleteObject
                    - s3:DeleteObjectVersion
                    - s3:GetObjectVersion
                    - s3:GetObjectACL
                    - s3:PutObjectACL
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'SFTPAssetsBucket'
                      - /*
                - Action:
                    - kms:DescribeKey
                    - kms:GenerateDataKey
                    - kms:Encrypt
                    - kms:Decrypt
                  Effect: Allow
                  Resource: !Ref 'CustomerManagedCmkArn'
              - - Action:
                    - s3:ListBucket
                    - s3:GetBucketLocation
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'SFTPAssetsBucket'
                - Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:DeleteObject
                    - s3:DeleteObjectVersion
                    - s3:GetObjectVersion
                    - s3:GetObjectACL
                    - s3:PutObjectACL
                  Effect: Allow
                  Resource: !Join
                    - ''
                    - - !If
                        - InGovCloudRegion
                        - arn:aws-us-gov
                        - arn:aws
                      - ':s3:::'
                      - !Ref 'SFTPAssetsBucket'
                      - /*
            Version: '2012-10-17'
          PolicyName: SFTPSUserRolePolicy
      RoleName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - SFTPUserRole
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
    Type: AWS::IAM::Role
  SFTPUserScopeDownPolicy:
    Condition: UseSFTPServerCondition
    Properties:
      PolicyDocument:
        Statement: !If
          - UseSFTPWithKMSCondition
          - - Action:
                - s3:ListBucket
              Condition:
                StringLike:
                  s3:prefix:
                    - ${transfer:UserName}/*
                    - ${transfer:UserName}
              Effect: Allow
              Resource:
                - arn:aws:s3:::${transfer:HomeBucket}
              Sid: AllowListingOfSFTPUserFolder
            - Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObjectVersion
                - s3:DeleteObject
                - s3:GetObjectVersion
              Effect: Allow
              Resource:
                - !Join
                  - /
                  - - !GetAtt 'SFTPAssetsBucket.Arn'
                    - ${transfer:UserName}
                - !Join
                  - /
                  - - !GetAtt 'SFTPAssetsBucket.Arn'
                    - ${transfer:UserName}/*
              Sid: HomeDirObjectAccess
            - Action:
                - kms:DescribeKey
                - kms:GenerateDataKey
                - kms:Encrypt
                - kms:Decrypt
              Effect: Allow
              Resource: !Ref 'CustomerManagedCmkArn'
          - - Action:
                - s3:ListBucket
              Condition:
                StringLike:
                  s3:prefix:
                    - ${transfer:UserName}/*
                    - ${transfer:UserName}
              Effect: Allow
              Resource:
                - arn:aws:s3:::${transfer:HomeBucket}
              Sid: AllowListingOfSFTPUserFolder
            - Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObjectVersion
                - s3:DeleteObject
                - s3:GetObjectVersion
              Effect: Allow
              Resource:
                - !Join
                  - /
                  - - !GetAtt 'SFTPAssetsBucket.Arn'
                    - ${transfer:UserName}
                - !Join
                  - /
                  - - !GetAtt 'SFTPAssetsBucket.Arn'
                    - ${transfer:UserName}/*
              Sid: HomeDirObjectAccess
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  TransferServer:
    Condition: UseSFTPServerCondition
    Properties:
      EndpointType: PUBLIC
      IdentityProviderType: SERVICE_MANAGED
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - sftp
    Type: AWS::Transfer::Server
  VPCS3Endpoint:
    Properties:
      RouteTableIds:
        - !Ref 'NatGatewayRouteTable'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref 'Vpc'
    Type: AWS::EC2::VPCEndpoint
  Vpc:
    Properties:
      CidrBlock: !Ref 'VpcCidr'
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: aws-web-stacks:stack-name
          Value: !Ref 'AWS::StackName'
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - vpc
    Type: AWS::EC2::VPC

